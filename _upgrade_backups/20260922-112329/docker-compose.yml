version: "3.8"

services:
  api:
    image: ${IMAGE_NAME:-comfy-orchestrator}:${IMAGE_TAG:-latest}
    command: ["node", "index.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3000}
      COMFY_URL: ${COMFY_URL}
      COMFY_MODELS_DIR: ${COMFY_MODELS_DIR:-/models}
      DEFAULT_CHECKPOINT: ${DEFAULT_CHECKPOINT}
      FACE_DETECTOR_MODEL: ${FACE_DETECTOR_MODEL}
      HAND_DETECTOR_MODEL: ${HAND_DETECTOR_MODEL}
      LOCAL_CAPTION_NODE: ${LOCAL_CAPTION_NODE}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGSSLMODE: ${PGSSLMODE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      REDIS_QUEUE_KEY: ${REDIS_QUEUE_KEY}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ${COMFY_MODELS_HOST_DIR}:/models:ro
    networks:
      - databases
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

  worker:
    image: ${IMAGE_NAME:-comfy-orchestrator}:${IMAGE_TAG:-latest}
    command: ["node", "worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      COMFY_URL: ${COMFY_URL}
      COMFY_POLL_INTERVAL_MS: ${COMFY_POLL_INTERVAL_MS}
      COMFY_JOB_TIMEOUT_MS: ${COMFY_JOB_TIMEOUT_MS}
      COMFY_MAX_ATTEMPTS: ${COMFY_MAX_ATTEMPTS}
      COMFY_MODELS_DIR: ${COMFY_MODELS_DIR:-/models}
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS}
      STUCK_AFTER_MS: ${STUCK_AFTER_MS}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGSSLMODE: ${PGSSLMODE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      REDIS_QUEUE_KEY: ${REDIS_QUEUE_KEY}
    volumes:
      - ${COMFY_MODELS_HOST_DIR}:/models:ro
    networks:
      - databases
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      restart_policy:
        condition: on-failure

networks:
  databases:
    external: true
